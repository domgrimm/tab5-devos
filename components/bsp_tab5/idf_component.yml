## Touch controllers for the Tab5 display revisions. The component manager
## adds these (and their esp_lcd_touch dependency) to bsp_tab5's REQUIRES
## automatically, so bsp_tab5.c can include the touch headers directly.
##   - GT911:  ILI9881C revision (separate capacitive touch)
##   - ST7123: ST7123 / ST7121 revisions (integrated TDDI touch)
## The panel/LCD drivers (ILI9881C, ST7123) are vendored locally, so they are
## intentionally not listed here.
dependencies:
  idf: ">=5.4"
  espressif/esp_lcd_touch_gt911: "*"
  espressif/esp_lcd_touch_st7123: "*"
