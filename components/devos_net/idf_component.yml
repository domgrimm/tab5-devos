## Managed dependencies for real Wi-Fi on the ESP32-P4.
## The P4 has no radio; Wi-Fi is proxied to the on-board ESP32-C6 over SDIO
## via ESP-Hosted. esp_wifi_remote transparently routes the standard esp_wifi_*
## API to the C6 slave, so devos_net.c uses esp_wifi.h unchanged.
## Versions pinned to the set M5Stack ships in M5Tab5-UserDemo.
dependencies:
  idf: ">=5.4"
  espressif/esp_hosted: "1.4.0"
  espressif/esp_wifi_remote: "0.8.5"
